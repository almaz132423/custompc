version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: customps_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: customps
      POSTGRES_PASSWORD: customps_dev_password
      POSTGRES_DB: customps
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Adminer — простой веб-интерфейс для просмотра базы данных в браузере.
  # После запуска доступен на http://localhost:8080
  # Система: PostgreSQL, Сервер: postgres, Пользователь: customps,
  # Пароль: customps_dev_password, База данных: customps
  adminer:
    image: adminer
    container_name: customps_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
